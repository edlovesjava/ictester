<text x="1272" y="204" font-size="12" text-anchor="start" font-weight="normal" fill="#b03a2e">+5V  → Nano 5V pin</text>
<rect x="1080" y="250" width="400" height="140" rx="6" fill="#fdecea" stroke="#000" stroke-dasharray="6,4"/>
<text x="1100" y="275" font-size="14" text-anchor="start" font-weight="bold" fill="#000">mcu power</text>
<text x="1100" y="300" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Nano 5V pin ← +5V, plus C9 10 µF + C10 100 nF at the pin.</text>
<text x="1100" y="319" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Nano VIN is NOT connected (no second regulator).</text>
<text x="1100" y="338" font-size="12" text-anchor="start" font-weight="normal" fill="#000">USB plugged in with 12 V off: USB back-feeds</text>
<text x="1100" y="357" font-size="12" text-anchor="start" font-weight="normal" fill="#000">+5V through the Nano's diode; D2 protects U1.</text>
<text x="40" y="500" font-size="13" text-anchor="start" font-weight="normal" fill="#000">D1 1N5819 (Schottky): reverse-polarity protection. Drop ≈ 0.3-0.45 V at 150 mA (estimate), so V_IN ≈ 11.6 V from a 12 V adapter.</text>
<text x="40" y="520" font-size="13" text-anchor="start" font-weight="normal" fill="#000">U1 dissipation at 150 mA (estimate: Nano 25 + OLED 20 + expanders/INA 3 + LEDs 6 + worst chip 60 + one contention 23 ≈ 140 mA):</text>
<text x="40" y="540" font-size="13" text-anchor="start" font-weight="normal" fill="#000">      P = (V_IN − 5 V) × I + V_IN × Id = (11.6 − 5) V × 0.15 A + 11.6 V × 0.008 A = 0.99 W + 0.093 W = 1.083 W</text>
<text x="40" y="560" font-size="13" text-anchor="start" font-weight="normal" fill="#000">      rise = 1.083 W × 50 °C/W (bare TO-220) = 54.2 °C  →  79.2 °C at 25 °C ambient. Fit a clip-on heatsink, or use a 9 V adapter.</text>
<text x="40" y="580" font-size="13" text-anchor="start" font-weight="normal" fill="#000">R1/R2 divide V_IN by (22k + 10k) / 10k = 3.2 for A6: 11.6 V → 3.63 V; 15 V → 4.69 V (still under 5 V). Firmware refuses to test if V_IN is absent.</text>
<text x="40" y="600" font-size="13" text-anchor="start" font-weight="normal" fill="#000">C1/C2 at U1's IN pin, C3/C4 at its OUT pin: the datasheet asks for them close to the regulator.</text>
<text x="40" y="620" font-size="13" text-anchor="start" font-weight="normal" fill="#000">One ground, star-joined here at U1's GND pin; every other block's ground returns to this point.</text></g></svg>