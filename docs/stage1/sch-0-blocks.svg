<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1180" font-family="DejaVu Sans, Arial"><defs><marker id="a000" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="ac0392b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a1f5fa8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="a2e7d32" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="40" width="300" height="150" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="190.0" y="70" font-size="20" text-anchor="middle" font-weight="bold">12 V DC in  (sheet 1)</text><text x="190.0" y="96" font-size="14" text-anchor="middle">barrel jack</text><text x="190.0" y="116" font-size="14" text-anchor="middle">D1 1N5819 reverse-polarity</text><text x="190.0" y="136" font-size="14" text-anchor="middle">V_IN → A6 via 22k/10k</text><rect x="480" y="40" width="320" height="150" rx="6" fill="#fdecea" stroke="#000" stroke-width="2"/><text x="640.0" y="70" font-size="20" text-anchor="middle" font-weight="bold">main power  (sheet 1)</text><text x="640.0" y="96" font-size="14" text-anchor="middle">12 V → 5 V (L7805 or buck)</text><text x="640.0" y="116" font-size="14" text-anchor="middle">1N4007 OUT→IN protection</text><text x="640.0" y="136" font-size="14" text-anchor="middle">ONE 5 V rail for everything</text><rect x="940" y="40" width="320" height="150" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1100.0" y="70" font-size="20" text-anchor="middle" font-weight="bold">uart / com  (on the Nano)</text><text x="1100.0" y="96" font-size="14" text-anchor="middle">the Nano's own USB</text><text x="1100.0" y="116" font-size="14" text-anchor="middle">(CH340 serial + bootloader)</text><text x="1100.0" y="136" font-size="14" text-anchor="middle">ISP header (later: UPDI)</text><rect x="40" y="300" width="240" height="170" rx="6" fill="#fdecea" stroke="#000" stroke-width="2"/><text x="160.0" y="330" font-size="20" text-anchor="middle" font-weight="bold">mcu power (1)</text><text x="160.0" y="356" font-size="14" text-anchor="middle">Nano 5V pin</text><text x="160.0" y="376" font-size="14" text-anchor="middle">fed from main 5 V</text><text x="160.0" y="396" font-size="14" text-anchor="middle">+ 10 µF, 100 nF</text><rect x="360" y="300" width="900" height="170" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="810.0" y="330" font-size="20" text-anchor="middle" font-weight="bold">mcu  (sheet 2)</text><text x="810.0" y="356" font-size="14" text-anchor="middle">Arduino Nano (328P), in female headers</text><text x="810.0" y="376" font-size="14" text-anchor="middle">SPI D10–D13 → expanders   I²C A4/A5 → OLED, INA219</text><text x="810.0" y="396" font-size="14" text-anchor="middle">D2–D7 → 6 low-side GND switches   D8, D9 → button, LED</text><rect x="360" y="540" width="900" height="130" rx="6" fill="#eaf2fb" stroke="#000" stroke-width="2"/><text x="810.0" y="570" font-size="20" text-anchor="middle" font-weight="bold">pin drivers  (sheet 3)</text><text x="810.0" y="596" font-size="14" text-anchor="middle">2× MCP23S17 on SPI, one shared chip-select</text><text x="810.0" y="616" font-size="14" text-anchor="middle">24 lines → 24 × 220 Ω → ZIF 1–12, 29–40</text><text x="810.0" y="636" font-size="14" text-anchor="middle">GPA7/GPB7 (output-only) → 4 high-side VCC switches</text><rect x="40" y="540" width="240" height="370" rx="6" fill="#fdecea" stroke="#000" stroke-width="2"/><text x="160.0" y="570" font-size="20" text-anchor="middle" font-weight="bold">chip power (4)</text><text x="160.0" y="596" font-size="14" text-anchor="middle">INA219 + 0.1 Ω shunt</text><text x="160.0" y="616" font-size="14" text-anchor="middle">on the shared VCC feed</text><text x="160.0" y="636" font-size="14" text-anchor="middle"></text><text x="160.0" y="656" font-size="14" text-anchor="middle">4 high-side switches</text><text x="160.0" y="676" font-size="14" text-anchor="middle">ZIF 40, 1, 4, 5</text><text x="160.0" y="696" font-size="14" text-anchor="middle"></text><text x="160.0" y="716" font-size="14" text-anchor="middle">6 low-side switches</text><text x="160.0" y="736" font-size="14" text-anchor="middle">ZIF 7, 8, 10, 12, 36, 37</text><text x="160.0" y="756" font-size="14" text-anchor="middle"></text><text x="160.0" y="776" font-size="14" text-anchor="middle">decoupling on VCC_SW,</text><text x="160.0" y="796" font-size="14" text-anchor="middle">never on a ZIF contact</text><rect x="360" y="740" width="900" height="170" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="810.0" y="770" font-size="20" text-anchor="middle" font-weight="bold">zif  (sheet 5)</text><text x="810.0" y="796" font-size="14" text-anchor="middle">40-pin universal, chip top-justified (pin 1 → ZIF 1)</text><text x="810.0" y="816" font-size="14" text-anchor="middle">VCC/GND switch nodes on the ZIF side of the 220 Ω</text><text x="810.0" y="836" font-size="14" text-anchor="middle">ZIF 13–28 unused</text><rect x="40" y="990" width="1220" height="150" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="650.0" y="1020" font-size="20" text-anchor="middle" font-weight="bold">control  (sheet 2)</text><text x="650.0" y="1046" font-size="14" text-anchor="middle">SSD1306 OLED (I²C)   ·   ID button (short = identify, long = pin count)</text><text x="650.0" y="1066" font-size="14" text-anchor="middle">status LED   ·   power LED   ·   V_IN sense on A6</text><polyline points="340,115 476,115" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ac0392b)"/><text x="380" y="105" font-size="13" fill="#c0392b" font-weight="bold">12 V</text><polyline points="640,190 640,245 160,245 160,296" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ac0392b)"/><text x="420" y="238" font-size="13" fill="#c0392b" font-weight="bold">5 V</text><polyline points="640,245 1290,245 1290,1000 1264,1000" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ac0392b)"/><polyline points="20,245 20,720 36,720" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ac0392b)"/><line x1="160" y1="245" x2="20" y2="245" stroke="#c0392b" stroke-width="3"/><polyline points="280,760 356,760" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ac0392b)"/><text x="286" y="750" font-size="13" fill="#c0392b" font-weight="bold">Z nodes</text><polyline points="810,470 810,536" fill="none" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/><text x="820" y="510" font-size="13" fill="#1f5fa8" font-weight="bold">SPI</text><polyline points="810,670 810,736" fill="none" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/><text x="820" y="710" font-size="13" fill="#1f5fa8" font-weight="bold">24 × 220 Ω</text><polyline points="356,640 284,640" fill="none" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/><text x="290" y="632" font-size="12" fill="#1f5fa8" font-weight="bold">4 VCC</text><polyline points="420,470 420,500 160,500 160,536" fill="none" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/><text x="190" y="493" font-size="13" fill="#1f5fa8" font-weight="bold">6 GND gates, I²C</text><polyline points="1180,470 1180,520 1275,520 1275,985" fill="none" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a1f5fa8)"/><text x="1150" y="980" font-size="13" fill="#1f5fa8" font-weight="bold">I²C, D8/D9</text><polyline points="1100,190 1100,296" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#a2e7d32)"/><text x="1110" y="275" font-size="13" fill="#2e7d32" font-weight="bold">USB</text><text x="40" y="1170" font-size="14">Red = power, blue = signals, green = USB. One ground, star-joined at the main-power block.</text></svg>