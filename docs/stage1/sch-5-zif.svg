<text x="40" y="950" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Standard 14/16/20/24-pin parts: VCC = chip pin N → ZIF 40, GND = chip pin N/2 → ZIF 7/8/10/12.</text>
<text x="40" y="970" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Odd ones: 7490/92/93 VCC ZIF 5, GND ZIF 36 · 7473 VCC 4, GND 37 · 7476 VCC 5, GND 37 · 7483/75/96 VCC 5, GND 36 · 4049/50 VDD 1, VSS 8.</text>
<text x="40" y="990" font-size="13" text-anchor="start" font-weight="normal" fill="#000">Chip pin p → ZIF p for p ≤ N/2, else ZIF 40 − (N − p).</text></g></svg>