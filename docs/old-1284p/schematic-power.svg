<text x="30" y="830" font-size="13" text-anchor="start" font-weight="normal">Q1 base drive: I_B = (5 V - V_EB 0.7 V - V_OL ~0.1 V) / 1 kΩ - 0.7 V / 10 kΩ ≈ 4.1 mA: forced gain 5.3 at 22 mA, deeper than the BC327 sheet's V_CE(sat) ≤ 0.7 V point (500 mA / 50 mA).</text>
<text x="30" y="852" font-size="13" text-anchor="start" font-weight="normal">R1 holds Q1 OFF while U2 is in reset (all MCP23008 pins power up as inputs). The 100k gate resistors do the same for Q2-Q5.</text>
<text x="30" y="874" font-size="13" text-anchor="start" font-weight="normal">INA219 PGA /1: ±40 mV full scale / 0.1 Ω = ±400 mA; 10 µV LSB / 0.1 Ω = 0.1 mA per count. Firmware trips at 120 mA (LIMIT command).</text>
<text x="30" y="896" font-size="13" text-anchor="start" font-weight="normal">2N7000: R_DS(on) ≤ 6.0 Ω at V_GS 4.5 V, I_D 75 mA → at a standard 7400's I_CCL(max) 22 mA the chip's ground sits ≤ 0.13 V up. (A ULN2003 would lift it ~0.9 V: too much.)</text>
</svg>